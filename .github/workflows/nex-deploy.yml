name: NEX Site - automatische Veroeffentlichung

on:
  push:
    paths:
      - 'release/**'
      - 'deploy.json'
      - '.github/workflows/nex-deploy.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

concurrency:
  group: nex-site-deploy
  cancel-in-progress: false

jobs:
  site-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: FINNLI nach GitHub-Freigaben synchronisieren
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 --retry 0 \
            --header 'Accept: application/json' \
            'https://finnli.info/nex/deploy/sync.php' \
            -o /tmp/nex-release-result.json
          jq '{ok,reason,applied,release}' /tmp/nex-release-result.json
          jq -e '.ok == true' /tmp/nex-release-result.json >/dev/null
